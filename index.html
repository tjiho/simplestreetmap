<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Maps.ppsfleet.navy</title>
        <meta property="og:image:width" content="600" />
        <meta property="og:image:height" content="400" />
        <meta property="og:image:type" content="image/png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta property="og:title" content="Maps.ppsfleet.navy" />
        <meta
            name="viewport"
            content="initial-scale=1,maximum-scale=1,user-scalable=no"
        />
        <!-- mapbox -->
        <script src="https://static.ppsfleet.navy/js/maplibre-5.5.0.js"></script>
        <script src="https://static.ppsfleet.navy/js/pmtiles-4.3.0.js"></script>
        <link
            href="https://static.ppsfleet.navy/js/maplibre-5.5.0.css"
            rel="stylesheet"
        />
        <!-- css -->
        <link
            href="https://static.ppsfleet.navy/fonts/russisch-sans/style.css"
            rel="stylesheet"
        />
        <link href="./src/css/style.css" rel="stylesheet" />
        <!-- config -->
        <script src="./config.js"></script>
        <script src="./src/consts/tag-titles.js"></script>
        <!-- Add opening_hours object -->
        <script src="./static/opening_hours+deps.min.js"></script>
    </head>
    <body>
        <div id="map"></div>
        <div id="search-root"></div>
        <div id="places" style="display: none"></div>
        <div id="layer-switcher" style="display: none"></div>
        <c-poi-panel></c-poi-panel>

        <div id="mobile-sheet-root"></div>

        <div id="layer-legend"></div>

        <nav id="categories"></nav>

        <!-- todo: add a contextmenu -->

        <script type="module">
            import map from "./src/singletons/map.js";
            import { render, html } from "./src/libs/preact.mjs";
            import { registerSheetElements } from "./src/libs/pure-web-bottom-sheet.js";
            //import terrain from "./src/singletons/layers/terrain.js";
            import SearchComponent from "./src/components/SearchComponent.js";
            import MobileSearchComponent from "./src/components/MobileSearchComponent.js";
            import LayerSwitcher from "./src/components/LayerSwitcher.js";
            import LayerLegend from "./src/components/LayerLegend.js";

            registerSheetElements();

            // Monter SearchComponent
            render(
                html`<${SearchComponent} />`,
                document.getElementById("search-root"),
            );

            // Monter MobileSearchComponent (qui rend lui-même le <bottom-sheet>)
            render(
                html`<${MobileSearchComponent} />`,
                document.getElementById("mobile-sheet-root"),
            );

            // Déplacer places et layer-switcher dans search-container__top
            const searchTop = document.querySelector(
                "#search-container .search-container__top",
            );
            if (searchTop) {
                const placesEl = document.getElementById("places");
                const layerSwitcherEl =
                    document.getElementById("layer-switcher");
                if (placesEl) {
                    placesEl.style.display = "";
                    searchTop.appendChild(placesEl);
                }
                if (layerSwitcherEl) {
                    layerSwitcherEl.style.display = "";
                    searchTop.appendChild(layerSwitcherEl);
                }
            }

            // Monter LayerSwitcher
            render(
                html`<${LayerSwitcher} />`,
                document.getElementById("layer-switcher"),
            );

            // Monter LayerLegend (élément indépendant, positionné en fixed)
            render(
                html`<${LayerLegend} />`,
                document.getElementById("layer-legend"),
            );
            import PlaceComponent from "./src/components/PlaceComponent.js";
            import poiInfo from "./src/singletons/poiInfo.js";
        </script>

        <template id="template-chip-base">
            <div class="chip_delete">
                <img
                    src="./static/images/breeze/edit-delete-black.svg"
                    class="icon--medium icon--white"
                />
            </div>
            <div class="chip__name">
                <slot name="name">empty</slot>
            </div>
            <div class="chip__actions">
                <slot name="actions"></slot>
            </div>
            <link href="./src/css/chip.css" rel="stylesheet" />
        </template>
    </body>
</html>
